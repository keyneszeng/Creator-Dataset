[project]
name = "creator-dataset"
version = "0.1.0"
description = "Turn public creator content into structured, auditable datasets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "httpx>=0.27,<1.0",
]
xhs = [
  "xiaohongshu-cli>=0.6.4,<0.7",
]
ocr = [
  "rapidocr>=3.9,<4.0",
  "onnxruntime>=1.20,<2.0",
]
stt = [
  "faster-whisper>=1.2,<2.0",
]
cloud = [
  "boto3>=1.35,<2.0",
]
postgres = [
  "psycopg[binary]>=3.2,<4.0",
  "psycopg-pool>=3.2,<4.0",
]
llm = [
  "cryptography>=43,<47",
]

[project.scripts]
creator-dataset-worker = "app.worker:main"
creator-dataset-scheduler = "app.scheduler:main"
creator-dataset-backup = "app.backup:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
