services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: creator_dataset
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creator_dataset}
      POSTGRES_DB: creator_dataset
    volumes:
      - creator_dataset_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U creator_dataset -d creator_dataset"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ../..
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ../../.env
    environment:
      CREATOR_DATASET_DEPLOYMENT_MODE: cloud
      CREATOR_DATASET_DATABASE_BACKEND: postgres
      CREATOR_DATASET_DATABASE_URL: postgresql://creator_dataset:${POSTGRES_PASSWORD:-creator_dataset}@postgres:5432/creator_dataset
      CREATOR_DATASET_STORAGE_BACKEND: s3
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/system/readiness', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ../..
    command: creator-dataset-worker
    env_file:
      - ../../.env
    environment:
      CREATOR_DATASET_DEPLOYMENT_MODE: cloud
      CREATOR_DATASET_DATABASE_BACKEND: postgres
      CREATOR_DATASET_DATABASE_URL: postgresql://creator_dataset:${POSTGRES_PASSWORD:-creator_dataset}@postgres:5432/creator_dataset
      CREATOR_DATASET_STORAGE_BACKEND: s3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: ../..
    command: creator-dataset-scheduler
    env_file:
      - ../../.env
    environment:
      CREATOR_DATASET_DEPLOYMENT_MODE: cloud
      CREATOR_DATASET_DATABASE_BACKEND: postgres
      CREATOR_DATASET_DATABASE_URL: postgresql://creator_dataset:${POSTGRES_PASSWORD:-creator_dataset}@postgres:5432/creator_dataset
      CREATOR_DATASET_STORAGE_BACKEND: s3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  creator_dataset_postgres:
