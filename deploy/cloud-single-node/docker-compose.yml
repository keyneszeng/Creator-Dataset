services:
  api:
    image: creator-dataset:latest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ../../.env
    environment:
      CREATOR_DATASET_DEPLOYMENT_MODE: cloud
      CREATOR_DATASET_DATABASE_BACKEND: sqlite
      CREATOR_DATASET_DATABASE_PATH: /app/state/creator_dataset.sqlite3
      CREATOR_DATASET_STORAGE_BACKEND: s3
    ports:
      - "8000:8000"
    volumes:
      - creator_dataset_state:/app/state
    restart: unless-stopped

  worker:
    image: creator-dataset:latest
    command: creator-dataset-worker
    env_file:
      - ../../.env
    environment:
      CREATOR_DATASET_DEPLOYMENT_MODE: cloud
      CREATOR_DATASET_DATABASE_BACKEND: sqlite
      CREATOR_DATASET_DATABASE_PATH: /app/state/creator_dataset.sqlite3
      CREATOR_DATASET_STORAGE_BACKEND: s3
    volumes:
      - creator_dataset_state:/app/state
    restart: unless-stopped
    depends_on:
      - api

  scheduler:
    image: creator-dataset:latest
    command: creator-dataset-scheduler
    env_file:
      - ../../.env
    environment:
      CREATOR_DATASET_DEPLOYMENT_MODE: cloud
      CREATOR_DATASET_DATABASE_BACKEND: sqlite
      CREATOR_DATASET_DATABASE_PATH: /app/state/creator_dataset.sqlite3
      CREATOR_DATASET_STORAGE_BACKEND: s3
    volumes:
      - creator_dataset_state:/app/state
    restart: unless-stopped
    depends_on:
      - api

volumes:
  creator_dataset_state:
