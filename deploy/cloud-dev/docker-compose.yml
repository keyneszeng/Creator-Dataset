services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: creator_dataset
      POSTGRES_PASSWORD: creator_dataset
      POSTGRES_DB: creator_dataset
    ports:
      - "5432:5432"
    volumes:
      - creator_dataset_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator_dataset -d creator_dataset"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: creator_dataset
      MINIO_ROOT_PASSWORD: creator_dataset_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - creator_dataset_minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 creator_dataset creator_dataset_secret; do sleep 2; done;
      mc mb --ignore-existing local/creator-dataset;
      exit 0;
      "

  api:
    build:
      context: ../..
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      CREATOR_DATASET_DEPLOYMENT_MODE: cloud
      CREATOR_DATASET_DATABASE_BACKEND: postgres
      CREATOR_DATASET_DATABASE_URL: postgresql://creator_dataset:creator_dataset@postgres:5432/creator_dataset
      CREATOR_DATASET_STORAGE_BACKEND: s3
      CREATOR_DATASET_S3_BUCKET: creator-dataset
      CREATOR_DATASET_S3_ENDPOINT_URL: http://minio:9000
      CREATOR_DATASET_S3_ACCESS_KEY_ID: creator_dataset
      CREATOR_DATASET_S3_SECRET_ACCESS_KEY: creator_dataset_secret
      CREATOR_DATASET_S3_REGION: us-east-1
      CREATOR_DATASET_POSTGRES_POOL_MIN_SIZE: 1
      CREATOR_DATASET_POSTGRES_POOL_MAX_SIZE: 10
      CREATOR_DATASET_AGENT_FREE_MODE: "true"
      CREATOR_DATASET_CLOUD_AGENT_TOKEN: local-dev-agent-token
      CREATOR_DATASET_MCP_ALLOWED_HOSTS: "localhost:8000,127.0.0.1:8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ../..
    command: creator-dataset-worker
    environment:
      CREATOR_DATASET_DEPLOYMENT_MODE: cloud
      CREATOR_DATASET_DATABASE_BACKEND: postgres
      CREATOR_DATASET_DATABASE_URL: postgresql://creator_dataset:creator_dataset@postgres:5432/creator_dataset
      CREATOR_DATASET_STORAGE_BACKEND: s3
      CREATOR_DATASET_S3_BUCKET: creator-dataset
      CREATOR_DATASET_S3_ENDPOINT_URL: http://minio:9000
      CREATOR_DATASET_S3_ACCESS_KEY_ID: creator_dataset
      CREATOR_DATASET_S3_SECRET_ACCESS_KEY: creator_dataset_secret
      CREATOR_DATASET_S3_REGION: us-east-1
      CREATOR_DATASET_POSTGRES_POOL_MIN_SIZE: 1
      CREATOR_DATASET_POSTGRES_POOL_MAX_SIZE: 10
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    build:
      context: ../..
    command: creator-dataset-scheduler
    environment:
      CREATOR_DATASET_DEPLOYMENT_MODE: cloud
      CREATOR_DATASET_DATABASE_BACKEND: postgres
      CREATOR_DATASET_DATABASE_URL: postgresql://creator_dataset:creator_dataset@postgres:5432/creator_dataset
      CREATOR_DATASET_STORAGE_BACKEND: s3
      CREATOR_DATASET_S3_BUCKET: creator-dataset
      CREATOR_DATASET_S3_ENDPOINT_URL: http://minio:9000
      CREATOR_DATASET_S3_ACCESS_KEY_ID: creator_dataset
      CREATOR_DATASET_S3_SECRET_ACCESS_KEY: creator_dataset_secret
      CREATOR_DATASET_S3_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  creator_dataset_pg:
  creator_dataset_minio:
